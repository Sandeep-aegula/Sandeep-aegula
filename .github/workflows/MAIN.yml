# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snake

on:
  schedule:
    # Runs every 12 hours to keep the graph fresh
    - cron: "0 */12 * * *"
  
  # This command allows us to run the Action manually from the Actions tab.
  workflow_dispatch:
  
  # Also run on every push to the main branch
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    # Required permissions to write the generated files to the output branch
    permissions:
      contents: write

    steps:
      # Checks out your repository
      - name: Checkout
        uses: actions/checkout@v3

      # Generates the snake animation based on your public contributions
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Sandeep-aegula
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push the generated SVG files to a separate branch called "output"
      # This keeps your main branch clean while hosting the images.
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
